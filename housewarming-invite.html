<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're Invited | Housewarming</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #d4a373;
            --bg: #fefae0;
            --text: #606c38;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--accent), var(--text));
        }

        .kicker {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 2.5rem);
            margin: 0 0 20px 0;
            color: var(--primary);
            font-weight: 800;
        }

        .details {
            margin: 30px 0;
            padding: 20px;
            background: #fbfbfb;
            border-radius: 16px;
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #a0a0a0;
            display: block;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .qr-section {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 16px;
        }

        .qr-placeholder {
            width: 150px;
            height: 150px;
            background: #f0f0f0;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #888;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s;
            min-width: 200px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 30px;
            font-style: italic;
            color: var(--text);
            font-size: 0.9rem;
        }

        @media (min-width: 768px) {
            .card {
                padding: 60px 40px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="kicker">New Beginnings</span>
        <h1>We're moving in!</h1>
        <p>Please join us as we celebrate our new home and start this new chapter.</p>

        <div class="details">
            <div class="detail-item">
                <span class="detail-label">When</span>
                <span class="detail-value">October 25, 2026</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Time</span>
                <span class="detail-value">7:30 AM – 9:30 AM</span>
            </div>
        </div>

        <div class="qr-section">
            <span class="detail-label">Scan for Location</span>
            <!-- Using a QR API to generate the code for the provided link -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://maps.app.goo.gl/ZSqgJpeW3Bpj5hjb7?g_st=ac" alt="Location QR Code" width="150" height="150">
            <p style="font-size: 0.8rem; color: #666; margin-top: 10px; overflow-wrap: anywhere;">https://maps.app.goo.gl/ZSqgJpeW3Bpj5hjb7</p>
        </div>

        <div class="footer-note">
            We’d love to celebrate with you!
        </div>
        
        <a href="tel:[Phone number]" class="btn">RSVP to [Name]</a>
    </div>

</body>
</html>
